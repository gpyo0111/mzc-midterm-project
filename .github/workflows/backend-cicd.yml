name: Backend CI/CD

on:
  push:
    branches:
      - ci-cd
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            gpyo0111/mzc-backend:${{ github.sha }}
            gpyo0111/mzc-backend:ci-cd-${{ env.SHORT_SHA }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy backend to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            kubectl set image deployment/mzc-backend backend=gpyo0111/mzc-backend:${{ github.sha }} -n mzc
            kubectl rollout status deployment/mzc-backend -n mzc
            kubectl get pods -n mzc -o wide