name: Frontend CI/CD

on:
  push:
    branches:
      - ci-cd
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t gpyo0111/mzc-frontend:final \
            ./frontend

      - name: Push frontend image
        run: |
          docker push gpyo0111/mzc-frontend:final

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, k8s-cp, deploy]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update frontend deployment image
        run: |
          kubectl set image deployment/mzc-frontend \
            frontend=gpyo0111/mzc-frontend:final -n mzc

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/mzc-frontend -n mzc

      - name: Check deployment image
        run: |
          kubectl get deployment mzc-frontend -n mzc -o yaml | grep image: